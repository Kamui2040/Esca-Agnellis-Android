import java.util.Properties

plugins {
    id 'com.android.application'
}

def escaVersionCode = 41
def escaVersionName = '0.17.0'
def signingPropertiesPath = System.getenv('ESCA_SIGNING_PROPERTIES')
def signingProperties = new Properties()
def signingPropertiesFile = signingPropertiesPath ? file(signingPropertiesPath) : null
def signingPropertiesLoadFailure = null

def requiredSigningKeys = [
        'storeFile',
        'storePassword',
        'keyAlias',
        'keyPassword'
]

if (signingPropertiesFile != null && signingPropertiesFile.isFile()) {
    try {
        signingPropertiesFile.withInputStream {
            signingProperties.load(it)
        }
    }
    catch (Exception ex) {
        signingPropertiesLoadFailure = ex
    }
}

def missingSigningKeys = requiredSigningKeys.findAll {
    !signingProperties.getProperty(it)?.trim()
}

def configuredStoreFile = signingProperties.getProperty('storeFile') ?
        file(signingProperties.getProperty('storeFile')) :
        null

android {
    namespace 'com.k2040.escaagnellis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.k2040.escaagnellis'
        minSdk 26
        targetSdk 35
        versionCode escaVersionCode
        versionName escaVersionName
        manifestPlaceholders = [appLabel: 'Esca Agnellis']
    }

    signingConfigs {
        if (signingPropertiesLoadFailure == null &&
                signingPropertiesFile != null &&
                signingPropertiesFile.isFile() &&
                missingSigningKeys.isEmpty() &&
                configuredStoreFile != null &&
                configuredStoreFile.isFile()) {
            release {
                storeFile configuredStoreFile
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'Esca Agnellis Debug']
        }

        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("Esca-Agnellis-v${escaVersionName}-vc${escaVersionCode}-${variant.buildType}.apk")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
